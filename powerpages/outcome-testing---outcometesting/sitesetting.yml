- adx_description: "Exposes al_questionversion to the portal Web API so an unsubmitted review page can re-read its own checklist live (2026-09-21). Power Pages renders from a server-side cache that learns about a Dataverse write through polled change tracking, so a question retyped in the Code App could leave the form drawing the previous scale for up to fifteen minutes (AD-094, AD-117); the Web API is not that cache. READ ONLY in effect: the 'Question Version - read' table permission grants read alone, and the Web API cannot exceed a table permission, so enabling this adds no way to alter the checklist from a browser."
  adx_name: Webapi/al_questionversion/enabled
  adx_sitesettingid: e00c019c-c9b5-f111-aaac-e4fade069307
  adx_value: 'true'
- adx_description: "Columns the review page's freshness check reads on al_questionversion. Every one of them is already rendered into the page by the Liquid fetch above it, so this exposes nothing the checker cannot already see; it is the effective dates and the response type that let the page tell a superseded version from the one in force. _al_questionid_value is listed alongside al_questionid because a LOOKUP is allowlisted under the name the query actually SELECTS, and the page selects the _value form. Without it the WHOLE request is refused with 90040101, not just that one column, so the freshness check returned 403 on every page load from the day it shipped (2026-09-21) until 2026-09-22 - and failed silently, because the page renders from the Liquid fetch either way and the only symptom was a stale scale nobody could reproduce."
  adx_name: Webapi/al_questionversion/fields
  adx_sitesettingid: 28a859a4-c9b5-f111-aaac-e4fade069307
  adx_value: al_questionversionid,al_questiontext,al_responsetype,al_ismandatory,al_effectivefrom,al_effectiveto,al_questionid,_al_questionid_value
- adx_description: "Exposes al_reviewinstance to the portal Web API so the review page can request a submission. Paired with a one-column allowlist: the only writable column is al_submitrequested, which SubmitRequestPlugin reads. A Custom API cannot be called from a page and this replaces the cloud flow that used to bridge that gap."
  adx_name: Webapi/al_reviewinstance/enabled
  adx_sitesettingid: a1000000-0000-4000-8000-0000000000a3
  adx_value: 'true'
- adx_description: "Allowlist of columns the browser may write on al_reviewinstance. Two trigger columns: al_submitrequested, which SubmitRequestPlugin reads to drive submission; and al_answerrequest, which carries an answer payload consumed by AnswerRequestPlugin because the browser cannot create an al_response directly. Status, submitted-on and the assigned contact stay off the list so the plug-ins remain the sole authority."
  adx_name: Webapi/al_reviewinstance/fields
  adx_sitesettingid: a1000000-0000-4000-8000-0000000000a4
  adx_value: al_submitrequested,al_answerrequest
- adx_description: "Exposes contact to the portal Web API so a checker can request a claim. Paired with a one-column allowlist: the only writable column is al_claimrequest, which ClaimRequestPlugin reads. The browser used to POST an al_caseassignment carrying two @odata.bind lookups instead; Power Pages refused that association with 90040106 through three verified permission repairs, the same refusal and the same resolution as the answering module (AD-053). Writing a contact rather than an assignment is also the stronger boundary: the contact permission is Self-scoped, so the request can only reach the signed-in user's own row, and the plug-in takes the claimant from that row rather than from the payload."
  adx_name: Webapi/contact/enabled
  adx_sitesettingid: a1000000-0000-4000-8000-0000000000ac
  adx_value: 'true'
- adx_description: "Allowlist of columns the browser may write on contact. Five trigger columns: al_claimrequest, which carries the id of the case being claimed (AD-076); al_signoffrequest, which carries the T&C attestation as JSON (AD-099); al_regraderequest, which carries the final regraded outcome as JSON (OD-041); al_caseheaderrequest, which carries a Tax checker's edit of the two Tax team header fields as JSON (2026-09-13); and al_accountabilityrequest, which carries who carries a fail as JSON (2026-09-19). Each is acted on by its own plug-in, which checks the contact's web role server-side - the allowlist is per table, not per role, so a reviewer who may write the claim request cannot sign off or regrade through the others. Everything a contact record actually holds - name, email, the web roles - stays off this list, so exposing contact to the Web API grants the page these five writes and nothing else."
  adx_name: Webapi/contact/fields
  adx_sitesettingid: a1000000-0000-4000-8000-0000000000ad
  adx_value: al_claimrequest,al_signoffrequest,al_regraderequest,al_caseheaderrequest,al_accountabilityrequest
- adx_description: "Returns the plug-in's own refusal to the browser instead of the platform's generic \"Common Data Service error occurred.\" Without it every refusal on this site reaches the page as that one sentence and a 400, whatever it was: the review submit's list of unanswered required questions, the edit-conflict prompt, the sign-off and regrade preconditions. Every friendlyError on the site reads error.innererror.message and was written for this setting, which had never been created - reported 2026-09-13, against a submit that named the one question left unanswered in the plug-in trace and told the checker nothing. Documented default is False. Safe here because these messages are written to be read by the person who hit them: they carry a VALIDATION, PRECONDITION, CONFLICT or UNAUTHORIZED prefix, say what to do next, and never expose a table name, query, id or stack trace (PP-16). The pages cap anything else at 300 characters."
  adx_name: Webapi/error/innererror
  adx_sitesettingid: 8dea7fe4-27b0-f111-aaac-e4fade069307
  adx_value: 'true'
