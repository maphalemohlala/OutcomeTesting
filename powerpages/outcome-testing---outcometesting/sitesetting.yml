- adx_description: "DISABLED 2026-09-20 (audit finding 1). This exposed al_response to the portal Web API for the original answer-save path, which no longer exists: the page PATCHes al_reviewinstance.al_answerrequest and AnswerRequestPlugin -> AnswerWriter does the al_response write server-side as the application user. No template addresses /_api/al_responses. Left enabled it was a reachable, unused endpoint over a table every business role can read globally - one request could enumerate every answer to every check on every case. The columns a checker may save are unchanged; they travel through the request column instead."
  adx_name: Webapi/al_response/enabled
